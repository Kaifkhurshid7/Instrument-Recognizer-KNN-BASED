[pytest]
# Pytest configuration for Instrument Recognizer backend tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test output verbosity
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=backend
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=70

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require services)
    e2e: End-to-end tests (slowest)
    async: Async tests
    slow: Slow tests

# Test paths
testpaths =
    tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio mode (required for async tests with FastAPI)
asyncio_mode = auto

# Timeout for tests (seconds)
timeout = 30
